<style>

:root{

  --c-nikolina:#a8295f; --c-juniora:#0d7169; --c-nusima:#4548b8; --c-levi:#a35f00;
  --good:#1f7a3d; --good-bg:#e3f2e7; --warn:#946200; --warn-bg:#fbf0d6; --bad:#b3261e; --bad-bg:#fbe4e2; --idle-bg:#eceff0;
  --mark:#ffe58a;
  --f-display:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --acc:var(--c-nikolina);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121719; --surface:#1a2124; --sunk:#232c30; --line:#334046; --ink:#e6ecee; --muted:#9aa9ae;
  --c-nikolina:#f07aa9; --c-juniora:#4fc7bb; --c-nusima:#9a9cf5; --c-levi:#f0a948;
  --good:#7fd69a; --good-bg:#183326; --warn:#f0c463; --warn-bg:#3a2f12; --bad:#ff8f85; --bad-bg:#3d1b19; --idle-bg:#273034;
  --mark:#6b5a12; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121719; --surface:#1a2124; --sunk:#232c30; --line:#334046; --ink:#e6ecee; --muted:#9aa9ae;
  --c-nikolina:#f07aa9; --c-juniora:#4fc7bb; --c-nusima:#9a9cf5; --c-levi:#f0a948;
  --good:#7fd69a; --good-bg:#183326; --warn:#f0c463; --warn-bg:#3a2f12; --bad:#ff8f85; --bad-bg:#3d1b19; --idle-bg:#273034;
  --mark:#6b5a12; color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55}
.app[data-p="nikolina"]{--acc:var(--c-nikolina)} .app[data-p="juniora"]{--acc:var(--c-juniora)}
.app[data-p="nusima"]{--acc:var(--c-nusima)} .app[data-p="levi"]{--acc:var(--c-levi)}
.wrap{max-width:1060px;margin:0 auto;padding-inline:16px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:1.9rem;font-weight:700} h2{font-size:1.35rem;font-weight:700} h3{font-size:1.08rem;font-weight:600} h4{font-size:.98rem;font-weight:600}
p{margin:0} a{color:var(--acc)}
.muted{color:var(--muted)} .small{font-size:.86rem} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:.45em;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.5em .95em;font-weight:700;font-size:.92rem}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#111}}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:.3em .65em;font-size:.82rem}
input[type=text],input[type=url],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.55em .7em}
textarea{resize:vertical;min-height:90px}
.field{display:grid;gap:.3rem}
.stack{display:grid;gap:1rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.spacer{flex:1}

/* kopbalk */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;padding-block:.7rem}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:.5rem;background:none;border:0;padding:0}
.brand .dot{width:12px;height:12px;border-radius:3px;background:var(--acc)}
.tasksw{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.tasksw button{border:0;background:transparent;padding:.4em .9em;font-family:var(--f-mono);font-weight:500;font-size:.88rem}
.tasksw button[aria-pressed="true"]{background:var(--acc);color:var(--surface)}
.who{display:flex;align-items:center;gap:.5rem;border:1px solid var(--line);border-radius:999px;padding:.25rem .8rem .25rem .25rem;background:var(--surface);font-weight:700}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--surface);font-family:var(--f-display);font-weight:700}
.tabs{display:flex;gap:.2rem;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:.2rem}
.tabs button{border:0;background:none;padding:.65rem .85rem;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
main{padding-block:1.4rem 4rem}
.banner{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--warn-bg);padding:.7rem .9rem;border-radius:8px;margin-top:1rem}
.banner.info{border-left-color:var(--acc);background:var(--surface)}

/* profielkeuze */
.hero{padding-block:2.4rem 1.2rem;display:grid;gap:.7rem;max-width:62ch}
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin-top:1.2rem}
.pcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:1.1rem;display:grid;gap:.8rem;border-top:6px solid var(--pc)}
.pcard:hover{border-color:var(--pc)}
.pcard .avatar{width:46px;height:46px;font-size:1.3rem;background:var(--pc)}
.pcard h3{font-size:1.3rem}

/* kaarten */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.1rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.grid2>*,.grid3>*{min-width:0}
.tcard{display:grid;gap:.7rem;align-content:start}
.tcard .code{font-family:var(--f-mono);font-weight:500;color:var(--acc)}
.bignum{font-family:var(--f-display);font-weight:700;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:.3em;border-radius:999px;padding:.12em .6em;font-size:.78rem;font-weight:700;background:var(--idle-bg);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.acc{background:var(--sunk);color:var(--acc)}

/* upload */
.drop{border:2px dashed var(--line);border-radius:12px;padding:1.4rem;text-align:center;display:grid;gap:.5rem;justify-items:center;background:var(--surface)}
.drop.over{border-color:var(--acc);background:var(--sunk)}
.pages{display:grid;gap:.6rem;max-height:540px;overflow:auto;padding-right:.3rem}
.pg{border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem;background:var(--bg)}
.pg pre{white-space:pre-wrap;word-break:break-word;margin:.3rem 0 0;font-family:var(--f-body);font-size:.88rem}

/* beoordeling */
.gradebox{display:grid;grid-template-columns:auto 1fr;gap:1.3rem;align-items:center}
@media (max-width:560px){.gradebox{grid-template-columns:1fr}}
.gradenum{font-family:var(--f-display);font-weight:700;font-size:4.2rem;line-height:.9;color:var(--acc);font-variant-numeric:tabular-nums}
.meter{display:flex;gap:3px;margin-top:.5rem;flex-wrap:wrap}
.meter i{width:16px;height:10px;border-radius:2px;background:var(--idle-bg)}
.meter i.on{background:var(--good)} .meter i.half{background:var(--warn)}
.list{display:grid;gap:.7rem;margin:0;padding:0;list-style:none}
.item{border:1px solid var(--line);border-radius:10px;padding:.8rem .95rem;background:var(--surface);display:grid;gap:.45rem}
.item.st-good{border-left:4px solid var(--good)} .item.st-warn{border-left:4px solid var(--warn)} .item.st-bad{border-left:4px solid var(--bad)} .item.st-idle{border-left:4px solid var(--line)}
.ihead{display:flex;gap:.6rem;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.ihead>div{min-width:0;flex:1}
.ref{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);white-space:nowrap}
.quote{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--acc);background:var(--sunk);padding:.4rem .6rem;border-radius:0 6px 6px 0;font-style:italic;font-size:.9rem}
.quote:hover{background:var(--idle-bg)}
.quote .pgn{font-style:normal;font-family:var(--f-mono);font-size:.74rem;color:var(--acc);margin-left:.4rem;white-space:nowrap}
.tip{background:var(--bg);border-radius:8px;padding:.5rem .7rem;font-size:.92rem}
.tip b{color:var(--acc)}
details{border-top:1px solid var(--line);padding-top:.4rem}
summary{cursor:pointer;font-weight:700;font-size:.88rem;color:var(--muted)}
.gtable{overflow-x:auto}
.gtable table{border-collapse:collapse;font-family:var(--f-mono);font-size:.82rem;font-variant-numeric:tabular-nums}
.gtable td,.gtable th{border:1px solid var(--line);padding:.3rem .5rem;text-align:center}
.gtable th{background:var(--sunk);font-weight:500;text-align:left}
.gtable td.hit{background:var(--acc);color:var(--surface);font-weight:500}
.sgtext{border-left:3px solid var(--line);padding:.2rem 0 .2rem .8rem;font-size:.93rem;max-width:72ch}
.sgtext ul{margin:.3rem 0;padding-left:1.2rem}

/* AI-meter */
.gauge{height:12px;border-radius:999px;background:linear-gradient(90deg,var(--good),var(--warn),var(--bad));position:relative;margin:.6rem 0 .3rem}
.gauge b{position:absolute;top:-5px;width:4px;height:22px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}
.stat{background:var(--bg);border-radius:8px;padding:.6rem .7rem}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums}
.fix{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
@media (max-width:560px){.fix{grid-template-columns:1fr}}
.fix>div{border-radius:6px;padding:.4rem .6rem;font-size:.9rem;min-width:0;word-break:break-word}
.fix .from{background:var(--bad-bg)} .fix .to{background:var(--good-bg)}

/* chat */
.chat{display:grid;grid-template-rows:1fr auto;height:min(72vh,720px);border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.msgs{overflow:auto;padding:1rem;display:grid;gap:.8rem;align-content:start}
.msg{max-width:85%;padding:.6rem .85rem;border-radius:12px;min-width:0;word-break:break-word}
.msg.user{justify-self:end;background:var(--acc);color:var(--surface);border-bottom-right-radius:3px}
.msg.assistant{justify-self:start;background:var(--sunk);border-bottom-left-radius:3px}
.msg p+p,.msg ul,.msg ol{margin-top:.45rem} .msg ul,.msg ol{padding-left:1.2rem;margin-bottom:0} .msg h4{margin-top:.5rem}
.composer{border-top:1px solid var(--line);padding:.7rem;display:grid;gap:.5rem}
.composer .row textarea{min-height:46px;flex:1;min-width:0}
.sugg{display:flex;gap:.4rem;flex-wrap:wrap}
.sugg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.2rem .7rem;font-size:.82rem}

/* voortgang & viewer */
.busy{display:grid;gap:.4rem;border:1px solid var(--line);border-radius:10px;padding:.9rem;background:var(--surface)}
.bar{height:6px;border-radius:999px;background:var(--idle-bg);overflow:hidden}
.bar i{display:block;height:100%;width:35%;background:var(--acc);border-radius:999px;animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%;opacity:.5}}
.overlay{position:fixed;inset:0;background:rgba(10,15,18,.55);z-index:20;display:grid;place-items:center;padding:16px}
.viewer{background:var(--surface);border-radius:12px;width:min(820px,100%);max-height:88vh;display:grid;grid-template-rows:auto 1fr;overflow:hidden;border:1px solid var(--line)}
.viewer header{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.viewer .body{overflow:auto;padding:1rem 1.2rem}
.viewer pre{white-space:pre-wrap;word-break:break-word;font-family:var(--f-body);font-size:.93rem;margin:0}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 .1em}
.empty{text-align:center;padding:2.5rem 1rem;display:grid;gap:.6rem;justify-items:center}
.srcitem{display:flex;gap:.7rem;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:.7rem .85rem;background:var(--surface)}
.srcitem>div{min-width:0;flex:1}
.kind{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;padding:.15rem .4rem;border-radius:4px;background:var(--sunk);color:var(--acc)}
.foot{margin-top:2.5rem;border-top:1px solid var(--line);padding-top:1rem}
</style>

function md(src){
  const lines=esc(src).split("\n"); let out="", list=null;
  const inline=t=>t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[\s(])\*([^*\n]+?)\*(?=[\s).,!?:]|$)/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const close=()=>{if(list){out+=`</${list}>`;list=null}};
  for(const raw of lines){
    const l=raw.trimEnd();
    let m;
    if(m=l.match(/^#{1,4}\s+(.*)/)){close();out+=`<h4>${inline(m[1])}</h4>`}
    else if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(list!=="ul"){close();out+="<ul>";list="ul"}out+=`<li>${inline(m[1])}</li>`}
    else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=="ol"){close();out+="<ol>";list="ol"}out+=`<li>${inline(m[1])}</li>`}
    else if(!l.trim()){close()}
    else{close();out+=`<p>${inline(l)}</p>`}
  }
  close(); return out;
}

const Store = {
  db:null, mode:"laden", mem:{},
  key(pid,kind){return `smda:${pid}:${kind}`},
  localGet(pid,kind){ try{const v=localStorage.getItem(this.key(pid,kind)); if(v) return JSON.parse(v)}catch{} return this.mem[this.key(pid,kind)]||{} },
  localSet(pid,kind,obj){ this.mem[this.key(pid,kind)]=obj; try{localStorage.setItem(this.key(pid,kind),JSON.stringify(obj))}catch{} },

    if(this.db){ await this.db.collection(`p/${pid}/${kind}`).doc(id).delete(); return }

/* ============ PDF ============ */
async function pdfToPages(file){
  const data=new Uint8Array(await file.arrayBuffer());
  const pdf=await pdfjsLib.getDocument({data}).promise;
  const pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i); const tc=await page.getTextContent();
    let t=""; for(const it of tc.items){ t+=it.str; t+= it.hasEOL?"\n":(it.str.endsWith(" ")?"":" ") }
    pages.push(t.replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").replace(/ {2,}/g," ").trim());
  }
  return pages;
}
async function pdfToImages(file,nums){
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const out=[];
  for(const n of nums){ if(n<1||n>pdf.numPages) continue;
    const page=await pdf.getPage(n); const vp1=page.getViewport({scale:1}); const vp=page.getViewport({scale:Math.min(2,1300/vp1.width)});
    const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
    await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    out.push(await new Promise(r=>c.toBlob(r,"image/jpeg",.82)));
  }
  return out;
}
async function fileToPages(file){
  if(/\.pdf$/i.test(file.name)||file.type==="application/pdf") return pdfToPages(file);
  const t=await file.text(); return t.split(/\f/).map(s=>s.trim()).filter(Boolean);
}
function parsePageList(str,max,count){
  str=(str||"").trim(); const set=new Set();
  if(!str||str==="auto"){ if(max<=count){for(let i=1;i<=max;i++)set.add(i)} else {for(let k=0;k<count;k++)set.add(Math.round(1+k*(max-1)/Math.max(1,count-1)))} }
  else for(const part of str.split(",")){ const [a,b]=part.split("-").map(x=>parseInt(x)); if(!a)continue; for(let i=a;i<=(b||a);i++) set.add(i) }
  return [...set].filter(n=>n>=1&&n<=max).slice(0,count);
}

/* ============ AI-patroonanalyse (lokaal) ============ */
const AI_TERMS=["cruciaal","cruciale","essentieel","essentiële","naadloos","naadloze","holistisch","holistische","robuust","robuuste","baanbrekend","baanbrekende","transformatief","transformatieve","synergie","faciliteren","in de huidige","snel veranderende","speelt een cruciale rol","speelt een belangrijke rol","het is belangrijk om","van cruciaal belang","kortom","concluderend","al met al","bovendien","tevens","derhalve","een breed scala","scala aan","in een wereld waarin","waardevolle inzichten","sleutelrol","hand in hand","toekomstbestendig","naar een hoger niveau","delve","landscape","leverage","seamless","crucial","furthermore","moreover","tapestry","game-changer","gamechanger","unlock","empower","in today's","dynamische landschap","digitale landschap","het landschap"];
function heuristics(pages){
  const text=pages.join("\n"); const low=text.toLowerCase();
  const words=(text.match(/[\p{L}\d'-]+/gu)||[]).length||1;
  const em=(text.match(/—/g)||[]).length, en=(text.match(/ – /g)||[]).length;
  const curly=(text.match(/[“”‘’]/g)||[]).length, straight=(text.match(/["]/g)||[]).length;
  const emoji=(text.match(/\p{Extended_Pictographic}/gu)||[]).length;
  const colonBullets=(text.match(/^\s*(?:[-•▪●*]|\d+\.)?\s*[A-ZÀ-Ý][^\n:]{2,40}:\s+\S/gmu)||[]).length;
  const terms=[]; for(const t of AI_TERMS){ let i=0,c=0; while((i=low.indexOf(t,i))!==-1){ const pre=low[i-1]||" ", post=low[i+t.length]||" "; if(!/\p{L}/u.test(pre)&&!/\p{L}/u.test(post)) c++; i+=t.length } if(c) terms.push([t,c]) }
  terms.sort((a,b)=>b[1]-a[1]);
  const sents=text.replace(/\n+/g," ").split(/(?<=[.!?])\s+/).map(s=>(s.match(/[\p{L}\d'-]+/gu)||[]).length).filter(n=>n>=4);
  const mean=sents.reduce((a,b)=>a+b,0)/Math.max(1,sents.length);
  const sd=Math.sqrt(sents.reduce((a,b)=>a+(b-mean)**2,0)/Math.max(1,sents.length));
  const cv=mean?sd/mean:0;
  const termHits=terms.reduce((a,[,c])=>a+c,0);
  const per1k=n=>n*1000/words;
  let score=0;
  score+=Math.min(30,per1k(em)*6);
  score+=Math.min(35,per1k(termHits)*4);
  if(sents.length>=8) score+= cv<.3?20: cv<.42?10:0;
  score+=Math.min(10,per1k(colonBullets)*1.5);
  score+=emoji?5:0;
  return {words,em,en,curly,straight,emoji,colonBullets,terms:terms.slice(0,14),termHits,sentences:sents.length,meanLen:+mean.toFixed(1),cv:+cv.toFixed(2),score:Math.round(Math.min(100,score))};
}

async function handleUpload(file,task){
  if(!file) return;
  const key=S.pid+task;
  if(!/\.(pdf|txt|md)$/i.test(file.name)){ S.flash="Upload een PDF (exporteer PowerPoint/Word als PDF) of een .txt-bestand."; render(); return }
  S.busy[key]={stage:"Tekst uit "+file.name+" halen…"}; render();
  try{
    let pages=await fileToPages(file);
    let total=0; pages=pages.map(p=>{const room=Math.max(0,170000-total); total+=Math.min(p.length,room); return p.slice(0,room)});
    if(!pages.join("").trim()) throw new Error("Er zit geen selecteerbare tekst in deze PDF (waarschijnlijk gescand). Exporteer de PDF opnieuw vanuit PowerPoint/Word.");
    const prev=S.subs[task];
    const sub={task,fileName:file.name,pages,uploadedAt:Date.now(),part:prev?.part||""};
    await Store.put(S.pid,"subs",task,sub);
    S.subs[task]={id:task,...sub}; S.files[key]=file;
    S.flash=`${file.name} geüpload (${pages.length} pagina's). Vul eventueel je eigen deel in en klik op “Beoordeel”.`;
  }catch(e){ S.flash="Uploaden mislukt: "+(e.message||e.code||e) }
  delete S.busy[key]; render();
}

async function runGrade(task){
  const key=S.pid+task; const sub=S.subs[task]; if(!sub||!S.sample) return;
  const ctl=new AbortController();
  const visual=$("#visual")?.checked && S.files[key] && S.imgLimit>0;
  const pageSel=$("#vispages")?.value;
  S.busy[key]={stage:"Studiegids, rubric en je document klaarzetten…",ctl,parts:{grade:"bezig",ai:"bezig"}}; render();
  try{
    let images;
    if(visual){ S.busy[key].stage="Dia's als afbeelding voorbereiden…"; render();
      images=await pdfToImages(S.files[key],parsePageList(pageSel,sub.pages.length,Math.min(S.imgLimit,10))); }
    const heur=heuristics(sub.pages);
    S.busy[key].stage="Claude leest je werk naast de studiegids. Dit duurt meestal 1–3 minuten."; render();
    const opts={signal:ctl.signal,cache:false};
    const pg=S.sample.json(gradePrompt(task,sub,!!images?.length),{...opts,modelTier:"complex",...(images?.length?{images}:{})})
      .then(r=>{S.busy[key]&&(S.busy[key].parts.grade="klaar");render();return r});
    const pa=S.sample.json(aiPrompt(task,sub,heur),{...opts,modelTier:"default"})
      .then(r=>{S.busy[key]&&(S.busy[key].parts.ai="klaar");render();return r});
    const [g,a]=await Promise.allSettled([pg,pa]);
    if(g.status==="rejected" && a.status==="rejected") throw g.reason;
    const result=g.status==="fulfilled"?g.value:null, ai=a.status==="fulfilled"?a.value:null;
    const ev={task,createdAt:Date.now(),fileName:sub.fileName,heur,result,ai,visual:!!images?.length,
      errors:{grade:g.status==="rejected"?errText(g.reason):null, ai:a.status==="rejected"?errText(a.reason):null}};
    if(result) Object.assign(ev,computeGrade(task,result));
    const id=uid(); await Store.put(S.pid,"evals",id,ev);
    S.evals.push({id,...ev}); viewEvalId[task]=id;
    S.tab= result?"beoordeling":"ai";
    S.flash= (ev.errors.grade||ev.errors.ai) ? ("Deels gelukt. "+(ev.errors.grade?"Beoordeling: "+ev.errors.grade+" ":"")+(ev.errors.ai?"AI & taal: "+ev.errors.ai:"")) : "Beoordeling klaar.";
  }catch(e){ S.flash=errText(e) }
  delete S.busy[key]; render();
}
function computeGrade(task,result){
  const ids=rubricFor(task).flatMap(g=>g.items.map(i=>i[0]));
  const st=id=>(result.criteria||[]).find(c=>c.id===id)?.status;
  let met=0,half=0,hidden=0; ids.forEach(id=>{const s=st(id); if(s==="aangetoond")met++; else if(s==="deels")half++; else if(s==="niet_zichtbaar")hidden++});
  const count=Math.floor(met+half*0.5);
  return {met,half,hidden,total:ids.length,count,grade:gradeFor(task,count),gradeMin:gradeFor(task,met),gradeMax:gradeFor(task,met+half+hidden)};
}

async function addSource(form){
  const kind=S.srcForm, task=form.querySelector("#srctask").value;
  const title=form.querySelector("#srctitle")?.value.trim(), note=form.querySelector("#srcnote")?.value.trim()||"";
  const src={kind,task,addedAt:Date.now(),note};
  try{
    if(kind==="pdf"){
      const f=form.querySelector("#srcfile").files[0]; if(!f){S.flash="Kies eerst een bestand.";render();return}
      S.busy.src=true; render();
      const pages=await fileToPages(f); src.title=title||f.name; src.text=pages.map((p,i)=>`[p.${i+1}] ${p}`).join("\n").slice(0,180000);
    }else if(kind==="link"){
      const url=form.querySelector("#srcurl").value.trim(); if(!/^https?:\/\//.test(url)){S.flash="Vul een geldige link in (begint met https://).";render();return}
      src.url=url; src.title=title||url; src.text=form.querySelector("#srctext").value.trim().slice(0,180000);
    }else{
      const t=form.querySelector("#srctext").value.trim(); if(!t){S.flash="Plak eerst tekst.";render();return}

  }catch(e){ S.flash="Bron toevoegen mislukt: "+(e.message||e.code||e) }
  delete S.busy.src; render();
}

async function sendChat(text){
  text=(text||"").trim(); if(!text||!S.sample||S.chatCtl) return;
  const task=S.task; const chat=S.chats[task]||(S.chats[task]={id:task,messages:[]});
  chat.messages.push({role:"user",content:text,at:Date.now()});
  S.chatCtl=new AbortController(); S.chatStreaming=""; render(); scrollChat();
  const turns=[{role:"user",content:chatRules(task)},...chat.messages.slice(-20).map(m=>({role:m.role,content:m.content}))];
  try{
    const {text:ans}=await S.sample(turns,{cache:false,signal:S.chatCtl.signal,onText:({text})=>{S.chatStreaming=text;const el=$("#streaming");if(el){el.innerHTML=md(text);scrollChat()}}});
    chat.messages.push({role:"assistant",content:ans,at:Date.now()});
  }catch(e){
    if(e?.text) chat.messages.push({role:"assistant",content:e.text+"\n\n*(onderbroken)*",at:Date.now()});
    else if(e?.code!=="cancelled") chat.messages.push({role:"assistant",content:"⚠ "+errText(e),at:Date.now()});
  }
  S.chatCtl=null; S.chatStreaming="";
  chat.messages=chat.messages.slice(-80);
  try{await Store.put(S.pid,"chats",task,{messages:chat.messages})}catch{}
  render(); scrollChat();
}

/* ============ viewer: waar staat het in je document? ============ */
function locate(pages,quote,page){
  const q=norm(quote); if(!q) return {page:page||1};
  const tryPage=i=>{const t=norm(pages[i-1]); if(t.includes(q)) return true; const head=q.slice(0,40); return head.length>12&&t.includes(head)};
  if(page&&pages[page-1]&&tryPage(page)) return {page,found:true};
  for(let i=1;i<=pages.length;i++) if(tryPage(i)) return {page:i,found:true};
  return {page:page||1,found:false};
}
function highlight(text,quote){
  const e=esc(text); if(!quote) return e;
  const words=norm(quote).split(" ").filter(Boolean); if(!words.length) return e;
  const pat=words.slice(0,Math.min(words.length,40)).map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("[\\s\\S]{0,4}?\\s*[\\s\\S]{0,4}?");
  try{ const re=new RegExp(pat,"i"); if(re.test(e)) return e.replace(re,m=>`<mark id="hit">${m}</mark>`);
    const short=words.slice(0,6).map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("\\s+"); const re2=new RegExp(short,"i");
    if(re2.test(e)) return e.replace(re2,m=>`<mark id="hit">${m}</mark>`);
  }catch{}
  return e;
}
function openViewer(task,page,quote){
  const sub=S.subs[task]; if(!sub) return;
  const loc=locate(sub.pages,quote,page); let cur=loc.page;
  const ov=$("#overlay");
  const draw=()=>{
    ov.innerHTML=`<div class="viewer" role="dialog" aria-modal="true" aria-label="Document">
      <header><div style="min-width:0;flex:1"><div class="label">${esc(task)} · ${esc(sub.fileName)}</div><h3>Pagina ${cur} van ${sub.pages.length}</h3></div>
      <button class="btn sm" data-v="prev" ${cur<=1?"disabled":""}>← Vorige</button><button class="btn sm" data-v="next" ${cur>=sub.pages.length?"disabled":""}>Volgende →</button><button class="btn sm" data-v="close">Sluiten</button></header>
      <div class="body">${quote?`<p class="small muted" style="margin-bottom:.7rem">${loc.found&&cur===loc.page?"Gemarkeerd: de passage waar de beoordeling naar verwijst.":"Het exacte citaat is niet letterlijk teruggevonden; dit is de pagina waar de beoordeling naar verwijst."}</p>`:""}
      <pre>${cur===loc.page?highlight(sub.pages[cur-1]||"",quote):esc(sub.pages[cur-1]||"")}</pre></div></div>`;
    ov.hidden=false; setTimeout(()=>$("#hit")?.scrollIntoView({block:"center"}),30);
  };
  ov.onclick=e=>{const v=e.target.closest("[data-v]")?.dataset.v; if(e.target===ov||v==="close"){ov.hidden=true;ov.innerHTML=""} else if(v==="prev"){cur--;draw()} else if(v==="next"){cur++;draw()}};
  draw(); ov.querySelector("[data-v=close]").focus();
}

  const sugg=[
    ev?"Wat zijn de 3 dingen die mijn cijfer het snelst omhoog brengen?":"Wat moet er volgens de studiegids minimaal in "+task+" staan?",
    task==="SM1"?"Hoe werk ik het cognitief kompas goed uit?":task==="SM2"?"Hoe koppel ik mijn data-maturityscan aan DDMA?":"Hoe schrijf ik een sterke STARRT voor kritisch denken?",
    "Welke zinnen in mijn stuk klinken het meest als AI?",
    "Hoe ziet een goede AI-verantwoording eruit volgens APA?"
  ];
  return `<div class="stack">
  <div class="row"><div style="flex:1;min-width:0"><div class="label">Chatbot · ${task}</div><h2>Vraag het over je ${task}</h2><p class="small muted">${sub?`De chatbot kent de studiegids, “${esc(sub.fileName)}”${ev?", je laatste beoordeling":""} en je bronnen.`:`Nog geen document voor ${task}. De chatbot kent wel de studiegids.`}</p></div>
    ${msgs.length?`<button class="btn sm ghost" data-act="clearchat">Chat wissen</button>`:""}</div>
  <div class="chat">
    <div class="msgs" id="msgs">${msgs.length||S.chatCtl?"":`<div class="empty"><h3>Stel je eerste vraag</h3><p class="small muted">Bijvoorbeeld over een criterium uit de rubric of een dia van je eigen stuk.</p></div>`}
      ${msgs.map(m=>`<div class="msg ${m.role}">${m.role==="user"?esc(m.content).replace(/\n/g,"<br>"):md(m.content)}</div>`).join("")}
      ${S.chatCtl?`<div class="msg assistant" id="streaming">${S.chatStreaming?md(S.chatStreaming):`<span class="muted">Denkt na…</span>`}</div>`:""}
    </div>
    <form class="composer" id="chatform">
      ${!msgs.length?`<div class="sugg">${sugg.map(s=>`<button type="button" data-sugg="${esc(s)}">${esc(s)}</button>`).join("")}</div>`:""}
      <div class="row"><textarea id="chatbox" rows="2" placeholder="Typ je vraag… (Enter = versturen, Shift+Enter = nieuwe regel)" aria-label="Je vraag"></textarea>
      ${S.chatCtl?`<button type="button" class="btn" data-act="stopchat">Stop</button>`:`<button class="btn primary" type="submit" ${S.sample?"":"disabled"}>Verstuur</button>`}</div>
    </form>
  </div></div>`;
}

/* ============ events ============ */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-profile]"); if(!t) return;
  const d=t.dataset;
  if(d.profile){ loadProfile(d.profile); S.tab="overzicht"; return }
  if(d.act==="home"){ S.pid=null; render(); return }
  if(d.act==="noflash"){ S.flash=""; render(); return }
  if(d.q!==undefined){ openViewer(d.task||S.task,parseInt(d.page)||null,d.q); return }
  if(d.task){ S.task=d.task; S.flash=""; render(); return }
  if(d.tab){ S.tab=d.tab; render(); window.scrollTo({top:0}); if(d.tab==="chat") scrollChat(); return }
  if(d.goto){ const [k,tab]=d.goto.split(":"); S.task=k; S.tab=tab; render(); window.scrollTo({top:0}); return }
  if(d.act==="grade"){ savePart(S.task,$("#part")?.value||""); runGrade(S.task); return }
  if(d.act==="stop"){ S.busy[S.pid+S.task]?.ctl?.abort(); return }
  if(d.ask){ askInChat(d.ask); return }
  if(d.sugg){ sendChat(d.sugg); return }
  if(d.act==="stopchat"){ S.chatCtl?.abort(); return }
  if(d.act==="clearchat"){ S.chats[S.task]={id:S.task,messages:[]}; Store.put(S.pid,"chats",S.task,{messages:[]}).catch(()=>{}); render(); return }
  if(d.srcform){ S.srcForm=d.srcform; render(); return }
  if(d.delsrc){ delSource(d.delsrc); return }
  if(d.delev){ deleteEval(d.delev); return }
});
document.addEventListener("change",e=>{
  if(e.target.id==="file"){ handleUpload(e.target.files[0],S.task); e.target.value="" }
  if(e.target.id==="part"){ savePart(S.task,e.target.value) }
  if(e.target.id==="evalpick"){ viewEvalId[S.task]=e.target.value; render() }
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="chatform"){ const b=$("#chatbox"); const v=b.value; b.value=""; sendChat(v) }
  if(e.target.id==="srcform"){ addSource(e.target) }
});
document.addEventListener("keydown",e=>{ if(e.target.id==="chatbox"&&e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); $("#chatform").requestSubmit() } });
["dragover","dragenter"].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest?.("#drop"); if(d){e.preventDefault();d.classList.add("over")}}));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest?.("#drop"); if(d){e.preventDefault();d.classList.remove("over"); if(ev==="drop"&&e.dataTransfer.files[0]) handleUpload(e.dataTransfer.files[0],S.task)}}));

/* ============ start ============ */
(async function init(){
  render();
  const c=window.claude;
  const [db,sample]=c?.use?await Promise.all([c.use("db").catch(()=>null),c.use("sample").catch(()=>null)]):[null,null];
  Store.db=db; Store.mode=db?"db":"local"; S.sample=sample;
  if(sample){ try{const l=await sample.limits(); S.imgLimit=l?.images?.maxCount||0}catch{} }
  let last=null; try{last=localStorage.getItem("smda:last")}catch{}
  if(last&&PROFILES.some(p=>p.id===last)) loadProfile(last); else render();
})();
</script>
